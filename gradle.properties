# ---- AndroidX ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Kotlin ----
kotlin.code.style=official
kotlin.incremental=true

# ---- Gradle 性能 ----
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存默认关闭：KSP + Hilt 在部分 AGP 版本下仍有兼容问题，需要时再打开
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# ---- 依赖下载容错 ----
# 首次构建要拉 1GB 左右依赖，网络抖动会导致个别包握手失败。
# 加大超时与重试次数，避免一次抖动就要从头再来。
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1000

# ---- FFmpeg 后端 ----
# kit    = 使用 Maven Central 上的预编译 ffmpeg-kit AAR（默认，零编译依赖，任何平台可构建）
# native = 使用 app/src/main/cpp 的自研 JNI 层（需先跑 scripts/build-ffmpeg-android.sh）
ffmpegx.backend=kit

# 要打进 APK 的 ABI。只留 arm64-v8a 可把 APK 从 ~62MB 降到 ~25MB
ffmpegx.abis=arm64-v8a,armeabi-v7a,x86_64
