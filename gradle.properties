# ---- AndroidX ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- AGP 9 兼容开关 ----
#
# AGP 9.0 把三项行为默认翻转成 true，每一项都会破坏本项目的现有构建。
# 这里逐项 opt-out，回到 AGP 8.13 的行为。等插件生态补齐后再逐个放开。
#
# 1. android.newDsl=false
#    AGP 9 只用新 DSL 接口，旧 variant API（applicationVariants 等）不再暴露。
#    KSP 2.3.12 仍引用 BaseExtension / BaseVariant（已核对其在 AGP 9 中存在但被弃用），
#    为保证稳定先关掉。风险最低，可最先尝试放开。
#
# 2. android.builtInKotlin=false
#    AGP 9 默认启用内置 Kotlin 编译，而它**与 org.jetbrains.kotlin.android 插件不兼容**。
#    本项目用的就是后者（见根 build.gradle.kts）。不关掉会直接报插件冲突。
#    要迁移到 built-in Kotlin 需要改插件声明方式，属于独立任务，不放在这次升级里。
#
# 3. android.r8.strictFullModeForKeepRules=false
#    R8 严格全模式下，`-keep class A` 不再隐含保留默认构造函数。
#    本项目刚在 R8 上踩过坑（xpp3/org.xmlpull，见 proguard-rules.pro），
#    先保持旧行为，避免同时引入两个 R8 相关变量、出了问题无法归因。
#
# 注意：这三项 opt-out 会在 AGP 10.0 被移除（官方公告 2026 年中），
# 届时需要真正完成迁移。
android.newDsl=false
android.builtInKotlin=false
android.r8.strictFullModeForKeepRules=false

# ---- Kotlin ----
kotlin.code.style=official
kotlin.incremental=true

# ---- Gradle 性能 ----
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存默认关闭：KSP + Hilt 在部分 AGP 版本下仍有兼容问题，需要时再打开
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# ---- 依赖下载容错 ----
# 首次构建要拉 1GB 左右依赖，网络抖动会导致个别包握手失败。
# 加大超时与重试次数，避免一次抖动就要从头再来。
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1000

# ---- FFmpeg 核心 ----
# 单一后端：ffmpeg-kit-next（arthenica 官方续作，FFmpeg 9.0.1）。
# 它不发布 Maven 制品，AAR 需自行构建；这里指向构建产物的本地 Maven 仓库。
# 优先级：本文件 > local.properties > 环境变量 FFMPEGX_FFMPEG_KIT_NEXT_REPO > 默认相对路径
# ffmpegx.ffmpegKitNextRepo=../ffmpeg-kit-next/prebuilt/bundle-android-aar-24-maven

# 要打进 APK 的 ABI。只留 arm64-v8a 可把 APK 从 ~62MB 降到 ~25MB。
# 注意：构建 ffmpeg-kit-next 时用 --disable-arch-* 裁剪，两边保持一致才不会白装。
ffmpegx.abis=arm64-v8a,armeabi-v7a,x86_64
