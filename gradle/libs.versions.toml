[versions]
# =============================================================================
#  ⚠️ 整条链是**联动**的，任何一项单独升都会崩。改动前先读完这一段。
#
#  依赖链：AGP ← Gradle / Kotlin(KGP) ← KSP / Hilt ；backdrop ← Kotlin + shapes
#
#  硬约束（都已实测核对，不是猜的）：
#
#  1. Kotlin 元数据**不向下兼容**：依赖用 Kotlin X 编的，消费者编译器必须 ≥X。
#     看依赖 POM 里的 kotlin-stdlib 版本就知道它要多少：
#
#       backdrop 1.0.0/1.0.1/1.0.2  ->  2.2.21   （且不依赖 shapes）
#       backdrop 1.0.3/1.0.4        ->  2.3.0
#       backdrop 1.0.5              ->  2.3.0    + shapes 1.0.0
#       backdrop 1.0.6              ->  2.3.10   + shapes 1.2.0
#       backdrop 2.0.0/2.0.1        ->  2.3.21 / 2.4.10
#
#  2. shapes 全系都要求 Kotlin ≥2.3.0（1.2.0 起要 2.3.10，1.2.1 要 2.4.10）。
#     要 backdrop 1.0.6 的折射效果 + 上游同款 Capsule，就必须走 2.3.10 这一档。
#
#  3. Hilt 2.60 起要求 AGP ≥9.0.0；AGP 9.0 又要求 Gradle ≥9.1.0。
#     三者必须一起动，不能只升其中一个。
#
#  ⇒ 本组合（Kotlin 2.3.10 + backdrop 1.0.6 + shapes 1.2.0 + Hilt 2.60.1
#     + AGP 9.0.1 + Gradle 9.x）是能满足上述全部约束的**最低档**组合。
#     再往上（2.4.10 那档）只会引入更多 AGP 9 的破坏性变更，没有收益。
# =============================================================================

agp = "9.0.1"
kotlin = "2.3.10"
# KSP 2.2 及以前是 <kotlin>-<ksp> 格式（如 2.2.21-2.0.4）；
# 2.3.0 起 KSP2 与 Kotlin 解耦，改成独立版本线，对整个 2.3.x 都兼容。
ksp = "2.3.12"

# Hilt 必须 ≥2.60：2.3.x 的 Kotlin 元数据，旧版 Hilt 内置的 kotlin-metadata-jvm 读不了。
# 2.60.1 已实测与 AGP 9.0.1 兼容（它引用的 AndroidBasePlugin 在 gradle-api-9.0.1.jar 里）。
hilt = "2.60.1"

coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.0"
# Compose BOM 跟着 backdrop 1.0.6 走：它依赖 Compose 1.10.3（foundation/ui/ui-graphics），
# BOM 太旧会让 compose-ui 被顶到不匹配的版本，出现运行期 NoSuchMethodError。
# 2026.02.00 是提供 compose-ui 1.10.3 的那一档（material3 随之到 1.4.0）。
composeBom = "2026.02.00"
navigation = "2.9.0"
room = "2.8.5"
datastore = "1.1.7"
hiltNavigation = "1.2.0"
media3 = "1.6.1"
coil = "3.2.0"
serialization = "1.8.1"
coroutines = "1.10.2"
documentfile = "1.1.0"
splashscreen = "1.2.0"

# ---------------------------------------------------------------------------
# FFmpeg 核心：ffmpeg-kit-next（arthenica 官方续作）
#
# 版本号规则 == 上游 FFmpeg 的 major.minor（见 README §12）：
#   9.0.0  =>  FFmpeg 9.0.1
#   8.1.1  =>  FFmpeg 8.1.2
#
# FFmpegKitNext 不发布 Maven Central / CocoaPods / npm 制品，只发源码。
# 必须自己构建出 AAR，再放到本地 Maven 仓库（见 settings.gradle.kts 里的
# ffmpegKitNextRepo）。构建方式见 docs/ffmpeg-kit-next-build.md。
#
# 构建时必须加 --enable-gpl，否则不含 libx264/libx265，
# 「兼容优先」（全软编码）策略会因为找不到软件编码器而失效。
# ---------------------------------------------------------------------------
ffmpegKitNext = "9.0.0"

# ---------------------------------------------------------------------------
# Liquid Glass（毛玻璃）视觉效果：Kyant0/AndroidLiquidGlass
#
# 两个库，配套使用，版本必须匹配：
#   io.github.kyant0:backdrop  —— 底层绘制原语（Backdrop / drawBackdrop / blur / lens…）
#   io.github.kyant0:shapes    —— 形状（Capsule / RoundedRectangle…），backdrop 的运行时依赖
#
# ⚠️ 升到 1.0.6 的代价与收益（各版实测数据见文件顶部的依赖链注释）：
#   收益：1.0.6 是上游 catalog 示例所用的 API 档位，`lens` 的 chromaticAberration、
#         `Highlight.Default`、`rememberCombinedBackdrop` 等都能直接照抄示例代码；
#         且它自带 shapes，Capsule 可以真用上游同款形状。
#   代价：要求 Kotlin 2.3.10（连带 KSP / Hilt / AGP / Gradle 全部升级），
#         并依赖 Compose 1.10.3（composeBom 必须 ≥2026.02.00）。
#
# 1.0.2 → 1.0.6 的公开 API 逐项核对过，是本文件里少见的**纯增量**升级：
#   包名 com.kyant.backdrop(.effects/.backdrops/.highlight/.shadow) 不变，
#   drawBackdrop 仍是 12 参数（shape/effects/highlight/shadow/innerShadow/
#   layerBlock/onDrawSurface 全在），`sealed interface BackdropEffectScope : Density`。
# ---------------------------------------------------------------------------
liquidGlass = "1.0.6"
# backdrop 1.0.6 的 javadoc 声明其运行期依赖 shapes 1.2.0；
# 这里显式声明同样版本，避免被传递依赖解析到别的档位。
shapes = "1.2.0"

junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# 图标库已经冻结在 1.7.x，BOM 不再统一管理，必须显式给版本
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
androidx-compose-material3-window = { module = "androidx.compose.material3:material3-window-size-class" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }

# FFmpegKitNext：官方续作，从本地 Maven 仓库解析（自己构建，见 docs/）
# 会传递依赖 com.arthenica:smart-exception-java:0.2.1（走 mavenCentral）
ffmpeg-kit-next = { module = "com.arthenica:ffmpeg-kit-next", version.ref = "ffmpegKitNext" }

# Liquid Glass 效果（见上方 versions 注释）
# 绘制原语：drawBackdrop / lens / vibrancy / Highlight / Shadow 都在这里。
kyant-backdrop = { module = "io.github.kyant0:backdrop", version.ref = "liquidGlass" }
# 形状库。底栏的 `Capsule()` 就来自它（上游同款，见 kyant-shapes 上方的版本注释）。
# 显式声明是为了：
#   1) 版本可控（不让传递依赖解析到别的档位）；
#   2) 代码里能直接 import com.kyant.shapes.Capsule 而不触发「传递依赖不可见」问题
#      —— 这个坑本项目踩过（okio 那次，见 libs.versions.toml 里 okio 的注释）。
kyant-shapes = { module = "io.github.kyant0:shapes", version.ref = "shapes" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
