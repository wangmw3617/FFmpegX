[versions]
agp = "8.10.1"
# ⚠️ Kotlin 被 Liquid Glass 依赖顶到了 2.3.10：
# backdrop 1.0.6 的 POM 里直接写着 kotlin-stdlib 2.3.10，它自己就是
# 用 2.3.10 编的；shapes 更狠，最低也要 2.3.0。Kotlin 元数据版本
# 不向下兼容，2.1.x 的编译器读不了 2.3 编出来的 class，只能跟着升。
#
# 不能靠「删掉 shapes 依赖」来回避：backdrop 自己就传递依赖 shapes。
kotlin = "2.3.10"
ksp = "2.3.10"

# ⚠️ Hilt 必须 ≥2.60：Kotlin 升到 2.3.10 后，Hilt 的注解处理器读不了
# 新元数据，直接编译失败：
#   [Hilt] Provided Metadata instance has version 2.3.0, while maximum
#   supported version is 2.2.0. To support newer versions, update the
#   kotlin-metadata-jvm library.
# 各版本内置的 kotlin-metadata-jvm（决定能读多新的元数据）：
#   2.56.2 -> 未显式声明（实际 ≤2.2.0）
#   2.57.x -> 2.1.21
#   2.58 / 2.59.x -> 2.2.20
#   2.60+  -> 2.3.21   ← 只有它支持元数据 2.3.0
hilt = "2.60.1"

coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.0"
composeBom = "2025.05.00"
navigation = "2.9.0"
room = "2.7.1"
datastore = "1.1.7"
hiltNavigation = "1.2.0"
media3 = "1.6.1"
coil = "3.2.0"
serialization = "1.8.1"
coroutines = "1.10.2"
documentfile = "1.0.1"
splashscreen = "1.0.1"

# ---------------------------------------------------------------------------
# FFmpeg 核心：ffmpeg-kit-next（arthenica 官方续作）
#
# 版本号规则 == 上游 FFmpeg 的 major.minor（见 README §12）：
#   9.0.0  =>  FFmpeg 9.0.1
#   8.1.1  =>  FFmpeg 8.1.2
#
# FFmpegKitNext 不发布 Maven Central / CocoaPods / npm 制品，只发源码。
# 必须自己构建出 AAR，再放到本地 Maven 仓库（见 settings.gradle.kts 里的
# ffmpegKitNextRepo）。构建方式见 docs/ffmpeg-kit-next-build.md。
#
# 构建时必须加 --enable-gpl，否则不含 libx264/libx265，
# 「兼容优先」（全软编码）策略会因为找不到软件编码器而失效。
# ---------------------------------------------------------------------------
ffmpegKitNext = "9.0.0"

# ---------------------------------------------------------------------------
# Liquid Glass（毛玻璃）视觉效果：Kyant0/AndroidLiquidGlass
#
# 库名是 backdrop，发布在 Maven Central。它只提供底层绘制原语
# （Backdrop / drawBackdrop / layerBackdrop），**不含任何高层组件**，
# 卡片、按钮、导航栏都要自己按它的原语拼。
#
# ⚠️ 版本选择的两个硬约束（都是实测出来的）：
#    1) backdrop 2.0.0 起 AAR 元数据要求 minCompileSdk=37，
#       而本项目是 compileSdk 36（AGP 8.10.1 也不支持 37）→ 只能停在 1.x；
#    2) 1.0.5 以下（1.0.3/1.0.4）虽然 minCompileSdk=1 更宽松，
#       但它们用 Kotlin 2.3.0 编译，和 shapes 的最低要求一样。
#    取 1.0.6 + shapes 1.2.0：两者都由 Kotlin 2.3.10 编译，与本项目一致。
# ---------------------------------------------------------------------------
liquidGlass = "1.0.6"
kyantShapes = "1.2.0"

junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# 图标库已经冻结在 1.7.x，BOM 不再统一管理，必须显式给版本
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
androidx-compose-material3-window = { module = "androidx.compose.material3:material3-window-size-class" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }

# FFmpegKitNext：官方续作，从本地 Maven 仓库解析（自己构建，见 docs/）
# 会传递依赖 com.arthenica:smart-exception-java:0.2.1（走 mavenCentral）
ffmpeg-kit-next = { module = "com.arthenica:ffmpeg-kit-next", version.ref = "ffmpegKitNext" }

# Liquid Glass 效果（见上方 versions 注释）
kyant-backdrop = { module = "io.github.kyant0:backdrop", version.ref = "liquidGlass" }
kyant-shapes = { module = "io.github.kyant0:shapes", version.ref = "kyantShapes" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
