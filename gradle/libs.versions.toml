[versions]
agp = "8.10.1"
# ⚠️ Kotlin 的版本不是随便选的，它被 Liquid Glass 依赖钉住了上限。
#
# Kotlin 元数据**不向下兼容**：依赖是用 Kotlin X 编的，消费者编译器就得 ≥X。
# 直接看依赖 POM 里的 kotlin-stdlib 版本就知道它要多少：
#
#   backdrop 1.0.0 / 1.0.1 / 1.0.2   ->  2.2.21   （且不依赖 shapes）
#   backdrop 1.0.3 / 1.0.4           ->  2.3.0
#   backdrop 1.0.5                   ->  2.3.0    + shapes 1.0.0
#   backdrop 1.0.6                   ->  2.3.10   + shapes 1.2.0
#   backdrop 2.0.0 / 2.0.1           ->  2.3.21 / 2.4.10
#
# 取 **1.0.2**：它是唯一「Kotlin 2.2.21 + 不带 shapes」的版本，于是
# Kotlin 可以停在 2.2.21，Hilt 也就不用动（见下）。
#
# 为什么不用 1.0.6：它要求 Kotlin ≥2.3.10，而 Kotlin 2.3 的元数据
# Hilt 读不了，得升 Hilt；Hilt 2.60 又要求 AGP ≥9.0.0，本项目是 8.10.1。
# 一条链下来要把 AGP 也换掉，代价远大于收益。
kotlin = "2.2.21"
# KSP 2.2 及以前是 <kotlin>-<ksp> 格式；2.3.0 起才改成与 Kotlin 对齐的纯版本号
ksp = "2.2.21-2.0.4"

# Hilt 停在 2.56.2：它内置的 kotlin-metadata-jvm 最高支持元数据 2.2.0，
# 正好覆盖 Kotlin 2.2.21。再往上（2.57.x -> 2.1.21、2.58/2.59.x -> 2.2.20、
# 2.60+ -> 2.3.21）都没必要，且 2.60 起要求 AGP ≥9.0.0。
hilt = "2.56.2"

coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.0"
composeBom = "2025.05.00"
navigation = "2.9.0"
room = "2.8.5"
datastore = "1.1.7"
hiltNavigation = "1.2.0"
media3 = "1.6.1"
coil = "3.2.0"
serialization = "1.8.1"
coroutines = "1.10.2"
documentfile = "1.1.0"
splashscreen = "1.2.0"

# ---------------------------------------------------------------------------
# FFmpeg 核心：ffmpeg-kit-next（arthenica 官方续作）
#
# 版本号规则 == 上游 FFmpeg 的 major.minor（见 README §12）：
#   9.0.0  =>  FFmpeg 9.0.1
#   8.1.1  =>  FFmpeg 8.1.2
#
# FFmpegKitNext 不发布 Maven Central / CocoaPods / npm 制品，只发源码。
# 必须自己构建出 AAR，再放到本地 Maven 仓库（见 settings.gradle.kts 里的
# ffmpegKitNextRepo）。构建方式见 docs/ffmpeg-kit-next-build.md。
#
# 构建时必须加 --enable-gpl，否则不含 libx264/libx265，
# 「兼容优先」（全软编码）策略会因为找不到软件编码器而失效。
# ---------------------------------------------------------------------------
ffmpegKitNext = "9.0.0"

# ---------------------------------------------------------------------------
# Liquid Glass（毛玻璃）视觉效果：Kyant0/AndroidLiquidGlass
#
# 库名是 backdrop，发布在 Maven Central。它只提供底层绘制原语
# （Backdrop / drawBackdrop / layerBackdrop），**不含任何高层组件**，
# 卡片、按钮、导航栏都要自己按它的原语拼。
#
# ⚠️ 为什么停在 1.0.2（各版实测数据，见文件顶部 Kotlin 注释）：
#    1) 2.0.0 起 AAR 元数据要求 minCompileSdk=37，本项目是 compileSdk 36，
#       AGP 8.10.1 也不支持 37 → 只能停在 1.x；
#    2) 1.0.3 ~ 1.0.6 分别要求 Kotlin 2.3.0 / 2.3.10，会把 Hilt 一起顶上去；
#    3) 1.0.2 要求 Kotlin 2.2.21，且**不依赖 shapes**，AAR 元数据是
#       minCompileSdk=1 最宽松 —— 唯一能全链路不连锁升版的版本。
#
# 1.0.2 与 1.0.6 的公开 API 逐项核对过，完全一致：
#   包名 com.kyant.backdrop(.effects/.backdrops)、drawBackdrop、blur、lens、
#   vibrancy、rememberLayerBackdrop、layerBackdrop，
#   以及 `sealed interface BackdropEffectScope : Density`（toPx() 可用）。
#
# 顺带：本项目没有用到 shapes（Capsule 等），所以不引这个依赖。
# ---------------------------------------------------------------------------
liquidGlass = "1.0.2"

# ---------------------------------------------------------------------------
# WebDAV 客户端：bitfireAT/dav4jvm
#
# 只发到 **JitPack**（无 Maven Central 制品），所以 settings.gradle.kts 里
# 专门给它加了一个限定 group 的 jitpack 仓库。
#
# ⚠️ 为什么必须停在 **2.2.1**（不是「不想升级」，是升不了）：
#
#   版本      kotlin-stdlib   HTTP 客户端    对本项目
#   ------------------------------------------------------------------
#   4.1.0     2.4.10          Ktor 3.5.2     ✗ 元数据 2.4，Hilt 读不了
#   4.0.x     2.4.10          Ktor 3.5.x     ✗ 同上
#   3.0.x     2.3.21          Ktor 3.5.x     ✗ 元数据 2.3，Hilt 读不了
#   2.2.1     1.7.20          OkHttp 4.10.0  ✓ 唯一能合入
#
#   Kotlin 元数据**不向下兼容**：依赖用 Kotlin X 编的，消费方编译器就得 ≥X。
#   dav4jvm 从 3.0.0 起改用 Ktor 并升到 Kotlin 2.3，本项目停在 Kotlin 2.2.21
#   （被 Liquid Glass / Hilt / AGP 这条链钉死，见本文件顶部），消费不了。
#
# ⚠️ 由此带来的两个已知代价（已记入 README「已知限制」）：
#   1. 2.2.1 发布于 2021 年，其传递依赖 OkHttp 4.10.0 / commons-lang3 3.8.1
#      都是老版本，带已知安全公告。它们只在 WebDAV 功能里被用到，
#      且**不处理不可信输入**（只连用户自己填的服务器），风险可控。
#   2. JitPack 是单点依赖：它不可用时 CI 解析不到该坐标。
#      要彻底摆脱，得先把上面那条 Kotlin 链整体升级。
#
# 等依赖链整体升级到 Kotlin 2.4 / Hilt 新版 / AGP 9 之后，这里可以直接跳到
# 4.1.0 并同时去掉 jitpack 仓库之外的顾虑（Ktor 仍在 JitPack 之外）。
# ---------------------------------------------------------------------------
dav4jvm = "2.2.1"

# OkHttp：dav4jvm 2.2.1 的传递依赖会带 4.10.0，这里显式提到更新的 4.x。
# 不跨到 5.x —— 5.x 要求 minSdk 21 且改了若干 API，dav4jvm 2.2.1 是按 4.x
# 的 API 编的。4.12.0 是 4.x 的最后一版，修掉了 4.10 的若干 CVE。
okhttp = "4.12.0"

junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# 图标库已经冻结在 1.7.x，BOM 不再统一管理，必须显式给版本
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
androidx-compose-material3-window = { module = "androidx.compose.material3:material3-window-size-class" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }

# FFmpegKitNext：官方续作，从本地 Maven 仓库解析（自己构建，见 docs/）
# 会传递依赖 com.arthenica:smart-exception-java:0.2.1（走 mavenCentral）
ffmpeg-kit-next = { module = "com.arthenica:ffmpeg-kit-next", version.ref = "ffmpegKitNext" }

# Liquid Glass 效果（见上方 versions 注释）
# 只引 backdrop。backdrop 1.0.2 不依赖 shapes，本项目也没用到它。
kyant-backdrop = { module = "io.github.kyant0:backdrop", version.ref = "liquidGlass" }

# WebDAV 客户端（见上方 dav4jvm 注释：只能停在 2.2.1）
dav4jvm = { module = "com.github.bitfireAT:dav4jvm", version.ref = "dav4jvm" }
# 显式提升 dav4jvm 传递依赖的 OkHttp，修掉 4.10.0 的若干 CVE。
# 必须是 implementation 而非纯 BOM 约束，见 app/build.gradle.kts。
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
