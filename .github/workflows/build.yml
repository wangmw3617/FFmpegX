name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # ffmpeg-kit-next 的版本（与 gradle/libs.versions.toml 保持一致）
  FFMPEG_KIT_NEXT_VERSION: '9.0.0'
  # 构建 AAR 时用的 Nix profile
  FFMPEG_KIT_NEXT_NIX_PROFILE: 'android-r27d'
  # FFmpegX 打包的 ABI（与 gradle.properties 的 ffmpegx.abis 一致）
  FFMPEGX_ABIS: 'arm64-v8a,armeabi-v7a,x86_64'
  # AAR 启用的外部库指纹。**必须**参与缓存 key 计算：
  # 只改构建参数而不改 key，会命中上一次的旧 AAR，新参数永远不生效。
  # （v1.0.5 的「Encoder not found」就是这么来的：漏了 android-media-codec，
  #   而缓存 key 只含版本号与 ABI，参数变化根本不会触发重建。）
  FFMPEG_KIT_NEXT_LIBS_SLUG: 'gpl-x264-x265-mc-lame-opus-vorbis-vpx-ass'

jobs:
  # ===========================================================================
  #  ffmpeg-kit-next AAR
  #
  #  它不发布二进制制品，必须现场构建。单独抽成一个 job 是因为 test 与 build
  #  都依赖这个产物 —— 编译期要用到它的类型，没有 AAR 连编译都过不去。
  #  两级缓存：Maven 产物（命中即完全跳过）+ Nix store（加速未命中时的构建）。
  # ===========================================================================
  ffmpeg-kit-next:
    name: Build ffmpeg-kit-next AAR
    runs-on: ubuntu-latest
    steps:
      # 缓存 key 里不能出现逗号：actions/cache 会直接报
      # "Key Validation Error: ... cannot contain commas" 并让整个 job 失败。
      # 所以这里先把 ABI 列表转成无逗号的形式。
      - name: Normalize ABI list
        id: abis
        shell: bash
        run: |
          SLUG="$(echo "${FFMPEGX_ABIS}" | tr -d ' ' | tr ',' '_')"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "缓存键里的 ABI 片段 = ${SLUG}"

      - name: Cache AAR
        id: aar-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/prebuilt
          # restore-keys 的前缀也必须带上库指纹，否则仍会回退命中参数不同的旧 AAR
          key: ffmpegkitnext-${{ env.FFMPEG_KIT_NEXT_VERSION }}-${{ steps.abis.outputs.slug }}-${{ env.FFMPEG_KIT_NEXT_LIBS_SLUG }}-${{ runner.os }}
          restore-keys: ffmpegkitnext-${{ env.FFMPEG_KIT_NEXT_VERSION }}-${{ env.FFMPEG_KIT_NEXT_LIBS_SLUG }}-

      - name: Install Nix
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-store-${{ env.FFMPEG_KIT_NEXT_NIX_PROFILE }}-${{ runner.os }}

      - name: Clone ffmpeg-kit-next
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/arthenica/ffmpeg-kit-next.git \
            "${GITHUB_WORKSPACE}/src"

      # 由 FFMPEGX_ABIS 推导 --disable-arch-*：
      # 上游支持的 Android 架构名是 arm-v7a / arm-v7a-neon / arm64-v8a / x86 / x86_64，
      # 而 FFMPEGX_ABIS 用的是 Android 侧的名字（armeabi-v7a）。写死反而容易与
      # gradle.properties 的 ffmpegx.abis 脱节，所以在这里算出来。
      - name: Build AAR
        if: steps.aar-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/src
        shell: bash
        run: |
          # Android ABI -> 上游架构名
          UPSTREAM_ARCHS=""
          IFS=',' read -ra WANTED <<< "${FFMPEGX_ABIS}"
          for abi in "${WANTED[@]}"; do
            abi="$(echo "$abi" | xargs)"
            case "$abi" in
              arm64-v8a)    UPSTREAM_ARCHS="${UPSTREAM_ARCHS} arm64-v8a" ;;
              armeabi-v7a)  UPSTREAM_ARCHS="${UPSTREAM_ARCHS} arm-v7a" ;;
              x86)          UPSTREAM_ARCHS="${UPSTREAM_ARCHS} x86" ;;
              x86_64)       UPSTREAM_ARCHS="${UPSTREAM_ARCHS} x86_64" ;;
              *)            echo "::error::不支持的 ABI：$abi"; exit 1 ;;
            esac
          done
          echo "上游架构名：${UPSTREAM_ARCHS}"

          DISABLE=()
          for arch in arm-v7a arm-v7a-neon arm64-v8a x86 x86_64; do
            KEEP=no
            for want in ${UPSTREAM_ARCHS}; do
              [ "$arch" = "$want" ] && KEEP=yes && break
            done
            [ "$KEEP" = no ] && DISABLE+=("--disable-arch-${arch}")
          done
          echo "跳过的架构：${DISABLE[*]:-无}"

          # --enable-gpl 是必须的：不开就没有 libx264/libx265，
          # FFmpegX 的「兼容优先」（全软编码）策略会失效。
          ./nix-android.sh \
            -p "${FFMPEG_KIT_NEXT_NIX_PROFILE}" \
            --api-level=24 \
            "${DISABLE[@]}" \
            --enable-gpl \
            --enable-lib-x264 \
            --enable-lib-x265

          # 归拢到一个稳定路径，方便缓存与下游 job 引用
          mkdir -p "${GITHUB_WORKSPACE}/prebuilt"
          cp -r prebuilt/bundle-android-aar-24-maven/. "${GITHUB_WORKSPACE}/prebuilt/"

      - name: Verify AAR
        shell: bash
        run: |
          AAR="$(find "${GITHUB_WORKSPACE}/prebuilt" -name '*.aar' | head -1)"
          if [ -z "${AAR}" ]; then
            echo "::error::没有产出 AAR"
            exit 1
          fi
          ls -lh "${AAR}"

          echo "--- AAR 内包含的 ABI ---"
          # AAR 的 jni 目录按 jni/<abi>/ 存放，把它列出来核对
          unzip -l "${AAR}" | awk '$4 ~ /^jni\// { split($4, p, "/"); print p[2] }' | sort -u | tee /tmp/aar-abis.txt

          # 硬校验：编码器必须真的躺在 libavcodec.so 里。
          #
          # 上面那一串 --enable-lib-* 只是「请求」——构建脚本对不认识的选项是
          # **静默忽略**的（不报错、不退出），所以「构建成功」根本不能证明库编进去了。
          # 唯一可靠的信号是把产物拆开、从二进制里把编码器名抠出来。
          #
          # v1.0.5 就是栽在这里：漏了 --enable-lib-android-media-codec，
          # 构建一路绿灯，装到机器上每个转码任务都 "Encoder not found"。
          echo "--- 校验关键编码器（缺失即 fail）---"
          SO="$(unzip -l "${AAR}" | awk '/libavcodec\.so/ { print $4 }' | head -1)"
          if [ -z "${SO}" ]; then
            echo "::error::AAR 里找不到 libavcodec.so"
            exit 1
          fi
          unzip -p "${AAR}" "${SO}" > /tmp/libavcodec.so
          ls -lh /tmp/libavcodec.so

          MISSING=0
          for enc in libx264 libx265 h264_mediacodec hevc_mediacodec libmp3lame libopus libvpx libass; do
            if grep -aq "${enc}" /tmp/libavcodec.so; then
              echo "  [OK]   ${enc}"
            else
              echo "::error::libavcodec.so 缺少 ${enc} —— 构建参数可能被静默忽略，或该库构建失败"
              MISSING=1
            fi
          done
          if [ "${MISSING}" -ne 0 ]; then
            echo "::error::AAR 缺少必需编码器，拒绝继续（装上去必然报 Encoder not found）"
            exit 1
          fi
          echo "全部关键编码器就位"

      - name: Upload AAR repository
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-next-maven
          path: ${{ github.workspace }}/prebuilt
          # AAR 只在本次 run 的两个下游 job 用，3 天足够，也不占长期配额
          retention-days: 3
          if-no-files-found: error

  # ===========================================================================
  #  单元测试
  #
  #  命令生成（Commands）与硬件加速规划（HardwarePlanner）都是纯逻辑，
  #  但编译期仍然要解析 ffmpeg-kit-next 的类型，所以依赖上面的 AAR。
  # ===========================================================================
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: ffmpeg-kit-next
    steps:
      - uses: actions/checkout@v4

      # gradlew 在 Git 里以 100644（普通文件）入库时会缺少可执行位，
      # Linux runner 上直接 "Permission denied"（exit 126）。
      # .gitattributes 已声明 executable，但历史提交里没有该位，
      # 所以这里显式补一次，保证不依赖仓库状态。
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-kit-next-maven
          path: ${{ github.workspace }}/kit-next-repo

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          if [ ! -d "${SDK_ROOT}/cmdline-tools/latest" ]; then
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "${SDK_ROOT}/cmdline-tools/latest"
          fi
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-test-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-test-${{ runner.os }}-

      - name: Run unit tests
        env:
          FFMPEGX_FFMPEG_KIT_NEXT_REPO: ${{ github.workspace }}/kit-next-repo
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  #  构建 APK
  # ===========================================================================
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: [ffmpeg-kit-next, test]
    steps:
      - uses: actions/checkout@v4

      # 同 test job：历史提交里 gradlew 没有可执行位，显式补上
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-kit-next-maven
          path: ${{ github.workspace }}/kit-next-repo

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          if [ ! -d "${SDK_ROOT}/cmdline-tools/latest" ]; then
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "${SDK_ROOT}/cmdline-tools/latest"
          fi
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-build-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-build-${{ runner.os }}-

      # tag 形如 v1.0.3 -> 1.0.3，传给 Gradle 作为 versionName。
      # 非 tag 触发（main / PR）时留空，Gradle 用自己的默认值。
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=""
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "versionName = ${VERSION:-（未指定，用 Gradle 默认值）}"

      - name: Restore release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::未配置 RELEASE_KEYSTORE_BASE64，无法产出签名包"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${GITHUB_WORKSPACE}/release.jks"
          if [ ! -s "${GITHUB_WORKSPACE}/release.jks" ]; then
            echo "::error::release.jks 解码后为空，RELEASE_KEYSTORE_BASE64 可能不是合法的 base64"
            exit 1
          fi
          echo "RELEASE_STORE_FILE=${GITHUB_WORKSPACE}/release.jks" >> "$GITHUB_ENV"
          echo "已恢复签名密钥（$(stat -c%s "${GITHUB_WORKSPACE}/release.jks") 字节）"

      - name: Build debug APKs
        env:
          FFMPEGX_FFMPEG_KIT_NEXT_REPO: ${{ github.workspace }}/kit-next-repo
          FFMPEGX_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APKs
        env:
          FFMPEGX_FFMPEG_KIT_NEXT_REPO: ${{ github.workspace }}/kit-next-repo
          FFMPEGX_VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Release 包必须真的签名了 —— 没签名的话 Gradle 会静默产出
      # app-*-release-unsigned.apk，装不上，而且要到用户手里才被发现。
      - name: Verify APK signatures
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -e
          SIGNED="$(find app/build/outputs/apk/release -name '*-release.apk' 2>/dev/null | wc -l)"
          UNSIGNED="$(find app/build/outputs/apk/release -name '*unsigned*.apk' 2>/dev/null | wc -l)"
          echo "已签名 APK: ${SIGNED} 个；未签名 APK: ${UNSIGNED} 个"
          find app/build/outputs/apk/release -name '*.apk' -exec ls -lh {} \;
          if [ "${SIGNED}" -eq 0 ]; then
            echo "::error::没有产出已签名的 release APK（签名配置未生效）"
            exit 1
          fi
          if [ "${UNSIGNED}" -gt 0 ]; then
            echo "::error::存在未签名 APK，签名密钥未正确应用"
            exit 1
          fi
          # 用 apksigner 复核第一份产物，确认 v2/v3 签名真的在
          APKSIGNER="$(find "${ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -1)"
          FIRST="$(find app/build/outputs/apk/release -name '*-release.apk' | head -1)"
          "${APKSIGNER}" verify --print-certs "${FIRST}"

      # 注意：不能简单地 find 全部 *.apk 然后平铺到 artifacts/。
      # release 与 debug 包名只差最后一段（app-arm64-v8a-release.apk /
      # app-arm64-v8a-debug.apk），平铺后两个目录都会被塞进来，发布时就会
      # 把 debug 包也传上去。这里按构建类型分目录存放。
      - name: Collect APKs
        run: |
          set -e
          mkdir -p artifacts/release artifacts/debug
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} artifacts/release/ \;
          find app/build/outputs/apk/debug -name '*.apk' -exec cp {} artifacts/debug/ \;
          echo "--- release ---"; ls -lh artifacts/release/
          echo "--- debug ---";   ls -lh artifacts/debug/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegx-apks
          # 保留 release/ 与 debug/ 的层级，发布 job 才能只取 release/
          path: artifacts/**/*.apk
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  #  发布（仅 v* tag）
  # ===========================================================================
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: ffmpegx-apks
          path: apks

      # 只发布 release 包。debug 包虽然也在 artifact 里（便于排查），
      # 但绝不能进 Release 附件 —— 它是 debug 签名的，装不上正式包覆盖。
      - name: Select release APKs only
        shell: bash
        run: |
          set -e
          if [ -d apks/release ]; then
            mv apks/release/*.apk apks/
            rm -rf apks/release apks/debug
          fi
          COUNT="$(find apks -maxdepth 1 -name '*.apk' | wc -l)"
          echo "待发布的 release APK：${COUNT} 个"
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::没有找到可发布的 release APK"
            exit 1
          fi
          if find apks -maxdepth 1 -name '*-debug.apk' | grep -q .; then
            echo "::error::发布目录里混入了 debug 包"
            exit 1
          fi
          ls -lh apks/

      # 命名沿用 v1.0.0 / v1.0.1 的既有格式，便于对照升级：
      #   ffmpegx-v1.0.3-arm64-v8a-release.apk
      - name: Rename with version
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          cd apks
          for f in *.apk; do
            # app-arm64-v8a-release.apk -> ffmpegx-v1.0.3-arm64-v8a-release.apk
            ABIVAR="$(echo "$f" | sed -E 's/^app-(.+)-(debug|release)\.apk$/\1/')"
            BUILDVAR="$(echo "$f" | sed -E 's/^app-.+-(debug|release)\.apk$/\1/')"
            if [ "$ABIVAR" = "$f" ] || [ "$BUILDVAR" = "$f" ]; then
              echo "::error::无法从文件名解析 ABI 与构建类型：$f"
              exit 1
            fi
            mv "$f" "ffmpegx-v${VERSION}-${ABIVAR}-${BUILDVAR}.apk"
          done
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
