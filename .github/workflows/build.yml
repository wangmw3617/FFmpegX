name: Build

# 触发规则：
#   push 到 main    常规集成验证
#   push tag v*     额外产出签名 APK 并创建 Release
#   PR 到 main      合入前验证
#   手动触发        用于重跑
#
# 仅改动文档时跳过整套流水线，避免占用构建配额。路径过滤对 tag 推送不生效
# （GitHub 官方行为），因此打 tag 一定会触发发布。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: write

# 同一分支连续推送时只保留最后一次运行，避免多个 run 争抢 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 gradle/libs.versions.toml 的 ffmpegKitNext 保持一致
  FFMPEG_KIT_NEXT_VERSION: '9.0.0'
  FFMPEG_KIT_NEXT_NIX_PROFILE: 'android-r27d'
  # 与 gradle.properties 的 ffmpegx.abis 保持一致
  FFMPEGX_ABIS: 'arm64-v8a,armeabi-v7a,x86_64'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  # =========================================================== 静态检查闸门 ====
  #
  # 四个检查器都是纯词法/结构分析，几秒完成，不需要 AAR 与 Android SDK。
  # 放在最前面拦截语法、重复成员、@Composable 上下文、导入符号这四类问题，
  # 不必等几分钟的完整编译才发现。
  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run static checks
        run: |
          set -e
          KT_FILES="$(git ls-files '*.kt')"
          echo "待检查的 Kotlin 文件：$(echo "${KT_FILES}" | wc -l) 个"
          python3 scripts/checks/ktscan.py ${KT_FILES}
          python3 scripts/checks/dupcheck.py ${KT_FILES}
          python3 scripts/checks/composecheck.py ${KT_FILES}
          python3 scripts/checks/importcheck.py app/src

  # ================================================= ffmpeg-kit-next AAR ====
  #
  # ffmpeg-kit-next 不发布二进制制品，必须现场构建。单独成 job 是因为 test 与
  # build 在编译期都要用到它的类型，没有 AAR 连编译都过不去。
  aar:
    name: Build ffmpeg-kit-next AAR
    runs-on: ubuntu-latest
    steps:
      # 必须排在缓存恢复之前：actions/checkout 默认执行 git clean -ffdx，
      # 若在缓存之后运行会把刚恢复出来的 prebuilt/ 删掉。
      - uses: actions/checkout@v4

      - name: Resolve ABI slug
        id: abis
        run: echo "slug=$(echo "${FFMPEGX_ABIS}" | tr -d ' ' | tr ',' '_')" >> "$GITHUB_OUTPUT"

      # 缓存 key 含库清单指纹：改清单会强制重建，避免命中参数不同的旧 AAR
      - name: Cache AAR
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/prebuilt
          key: aar-${{ env.FFMPEG_KIT_NEXT_VERSION }}-${{ steps.abis.outputs.slug }}-${{ hashFiles('scripts/ffmpeg-kit-next-libs.txt') }}-${{ runner.os }}
          restore-keys: aar-${{ env.FFMPEG_KIT_NEXT_VERSION }}-${{ steps.abis.outputs.slug }}-

      - name: Install Nix
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-${{ env.FFMPEG_KIT_NEXT_NIX_PROFILE }}-${{ runner.os }}

      # 作者在 Windows 上开发，Git 无法记录可执行位，.sh 可能以 100644 入库，
      # Linux runner 上执行会直接 Permission denied（exit 126）。这里显式补一次。
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # 架构裁剪与外部库开关都由项目脚本处理，CI 不重复实现这套逻辑。
      - name: Build AAR
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 https://github.com/arthenica/ffmpeg-kit-next.git ../ffmpeg-kit-next
          ./scripts/build-ffmpeg-kit-next.sh --abis "${FFMPEGX_ABIS}"

          # 目录名可能带上游的变体后缀，与脚本一样做一次兜底查找
          MAVEN="$(find ../ffmpeg-kit-next/prebuilt -maxdepth 1 -type d -name 'bundle-android-aar-*-maven' | head -1)"
          [ -n "${MAVEN}" ] || { echo "::error::未找到 Maven 产物目录"; exit 1; }
          mkdir -p prebuilt
          cp -r "${MAVEN}/." prebuilt/

      # --enable 开关只是「请求」：ffmpeg-kit-next 对无法识别的选项静默忽略，
      # 因此构建成功并不能证明库真的编进去了。唯一可靠的信号是把产物拆开逐项核对。
      # 编码器符号从库清单派生，两者同源；滤镜清单对应 Commands.kt 实际生成的滤镜。
      - name: Verify AAR
        run: |
          set -e
          AAR="$(find prebuilt -name '*.aar' | head -1)"
          [ -n "${AAR}" ] || { echo "::error::没有产出 AAR"; exit 1; }
          ls -lh "${AAR}"

          echo "--- AAR 内的 ABI ---"
          unzip -l "${AAR}" | awk '$4 ~ /^jni\// { split($4, p, "/"); print p[2] }' | sort -u

          ENCODERS=""
          while IFS= read -r raw || [ -n "${raw}" ]; do
            raw="${raw%%#*}"
            raw="$(echo "${raw}" | xargs)"
            [ -n "${raw}" ] || continue
            [ "${raw%%=*}" = "gpl" ] && continue
            case "${raw}" in
              *=*) syms="${raw#*=}" ;;
              *)   syms="" ;;
            esac
            for s in $(echo "${syms}" | tr ',' ' '); do
              ENCODERS="${ENCODERS} ${s}"
            done
          done < scripts/ffmpeg-kit-next-libs.txt

          SO="$(unzip -l "${AAR}" | awk '/libavcodec\.so/ { print $4 }' | head -1)"
          [ -n "${SO}" ] || { echo "::error::AAR 里找不到 libavcodec.so"; exit 1; }
          unzip -p "${AAR}" "${SO}" > /tmp/libavcodec.so

          echo "--- 校验编码器 ---"
          MISSING=0
          for enc in ${ENCODERS}; do
            if grep -aq "${enc}" /tmp/libavcodec.so; then
              echo "  [OK]   ${enc}"
            else
              echo "::error::libavcodec.so 缺少 ${enc}（--enable 开关可能被静默忽略）"
              MISSING=1
            fi
          done
          [ "${MISSING}" -eq 0 ] || { echo "::error::AAR 缺少必需编码器，拒绝继续"; exit 1; }

          # .so 的字符串表以 NUL 结尾，先换成换行再做整行精确匹配，
          # 否则 "split" 会误命中 "splitxyz"。
          echo "--- 校验滤镜 ---"
          FILTER_SO="$(unzip -l "${AAR}" | awk '/libavfilter\.so/ { print $4 }' | head -1)"
          [ -n "${FILTER_SO}" ] || { echo "::error::AAR 里找不到 libavfilter.so"; exit 1; }
          unzip -p "${AAR}" "${FILTER_SO}" > /tmp/libavfilter.so
          tr '\0' '\n' < /tmp/libavfilter.so > /tmp/filter-names.txt

          MISSING_FILTER=0
          for flt in scale setsar fps format hwdownload hwupload \
                     crop transpose hflip vflip \
                     delogo boxblur pixelize overlay split \
                     setpts atempo volume afade loudnorm \
                     palettegen paletteuse concat hstack vstack \
                     subtitles pad drawtext trim select; do
            if grep -qxF "${flt}" /tmp/filter-names.txt; then
              echo "  [OK]   ${flt}"
            else
              echo "::error::libavfilter.so 缺少滤镜 ${flt}（对应功能会报 No such filter）"
              MISSING_FILTER=1
            fi
          done
          [ "${MISSING_FILTER}" -eq 0 ] || { echo "::error::AAR 缺少必需滤镜，拒绝继续"; exit 1; }

      - name: Upload AAR repository
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-next-maven
          path: ${{ github.workspace }}/prebuilt
          # 仅本次 run 的下游 job 使用，3 天足够
          retention-days: 3
          if-no-files-found: error

  # =============================================================== 单元测试 ====
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint, aar]
    steps:
      - uses: actions/checkout@v4

      # gradlew 在 Git 里以 100644 入库（历史提交缺少可执行位），Linux 上会
      # Permission denied（exit 126），这里显式补一次。
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - uses: ./.github/actions/setup-android-sdk
        with:
          platform: ${{ env.ANDROID_PLATFORM }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-kit-next-maven
          path: ${{ github.workspace }}/kit-next-repo

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        env:
          FFMPEGX_FFMPEG_KIT_NEXT_REPO: ${{ github.workspace }}/kit-next-repo
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  # =============================================================== 打包 APK ====
  #
  # 刻意不依赖 test：两者都只需要 AAR 与 lint，可以并行，总时长由较慢的那个决定。
  # 测试失败时整个 run 仍然是红的 —— release 同时依赖 test，不会出现
  # 「测试挂了但照样发布」。
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: [lint, aar]
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - uses: ./.github/actions/setup-android-sdk
        with:
          platform: ${{ env.ANDROID_PLATFORM }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-kit-next-maven
          path: ${{ github.workspace }}/kit-next-repo

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # tag 形如 v1.0.3 -> 1.0.3，作为 versionName 传给 Gradle。
      # 非 tag 触发时留空，Gradle 使用自己的默认值。
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          [ -n "${KEYSTORE_BASE64}" ] || { echo "::error::未配置 RELEASE_KEYSTORE_BASE64"; exit 1; }
          echo "${KEYSTORE_BASE64}" | base64 -d > "${GITHUB_WORKSPACE}/release.jks"
          [ -s "${GITHUB_WORKSPACE}/release.jks" ] || { echo "::error::release.jks 解码后为空"; exit 1; }
          echo "RELEASE_STORE_FILE=${GITHUB_WORKSPACE}/release.jks" >> "$GITHUB_ENV"

      - name: Build debug APKs
        env:
          FFMPEGX_FFMPEG_KIT_NEXT_REPO: ${{ github.workspace }}/kit-next-repo
          FFMPEGX_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APKs
        env:
          FFMPEGX_FFMPEG_KIT_NEXT_REPO: ${{ github.workspace }}/kit-next-repo
          FFMPEGX_VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 签名配置失效时 Gradle 会静默产出 *-release-unsigned.apk，装不上，
      # 且要到用户手里才会被发现，因此这里强制校验。
      - name: Verify APK signatures
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          SIGNED="$(find app/build/outputs/apk/release -name '*-release.apk' 2>/dev/null | wc -l)"
          UNSIGNED="$(find app/build/outputs/apk/release -name '*unsigned*.apk' 2>/dev/null | wc -l)"
          echo "已签名 APK: ${SIGNED} 个；未签名 APK: ${UNSIGNED} 个"
          [ "${SIGNED}" -gt 0 ] || { echo "::error::没有产出已签名的 release APK"; exit 1; }
          [ "${UNSIGNED}" -eq 0 ] || { echo "::error::存在未签名 APK，签名配置未生效"; exit 1; }
          APKSIGNER="$(find "${ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -1)"
          "${APKSIGNER}" verify --print-certs "$(find app/build/outputs/apk/release -name '*-release.apk' | head -1)"

      # release 与 debug 包名只差最后一段，平铺到同一目录会把 debug 包一起带上，
      # 因此按构建类型分目录存放，发布时只取 release/。
      - name: Collect APKs
        run: |
          set -e
          mkdir -p artifacts/release artifacts/debug
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} artifacts/release/ \;
          find app/build/outputs/apk/debug -name '*.apk' -exec cp {} artifacts/debug/ \;
          ls -lh artifacts/release/ artifacts/debug/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegx-apks
          path: artifacts/**/*.apk
          retention-days: 7
          if-no-files-found: error

  # =========================================================== 发布（仅 tag）====
  release:
    name: Publish release
    runs-on: ubuntu-latest
    # 必须同时等 test：build 与 test 并行，只依赖 build 的话
    # 「测试失败但打包成功」也会被发布出去。
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: ffmpegx-apks
          path: apks

      # debug 包虽在 artifact 里（便于排查），但绝不能进 Release 附件
      - name: Select release APKs only
        run: |
          set -e
          if [ -d apks/release ]; then
            mv apks/release/*.apk apks/
            rm -rf apks/release apks/debug
          fi
          COUNT="$(find apks -maxdepth 1 -name '*.apk' | wc -l)"
          echo "待发布的 release APK：${COUNT} 个"
          [ "${COUNT}" -gt 0 ] || { echo "::error::没有找到可发布的 release APK"; exit 1; }
          if find apks -maxdepth 1 -name '*-debug.apk' | grep -q .; then
            echo "::error::发布目录里混入了 debug 包"
            exit 1
          fi
          ls -lh apks/

      # 命名沿用 ffmpegx-v1.0.3-arm64-v8a-release.apk，便于对照升级
      - name: Rename with version
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          cd apks
          for f in *.apk; do
            ABI="$(echo "$f" | sed -E 's/^app-(.+)-(debug|release)\.apk$/\1/')"
            VARIANT="$(echo "$f" | sed -E 's/^app-.+-(debug|release)\.apk$/\1/')"
            if [ "$ABI" = "$f" ] || [ "$VARIANT" = "$f" ]; then
              echo "::error::无法从文件名解析 ABI 与构建类型：$f"
              exit 1
            fi
            mv "$f" "ffmpegx-v${VERSION}-${ABI}-${VARIANT}.apk"
          done
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
