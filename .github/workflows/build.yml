name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # ffmpeg-kit-next 的版本（与 gradle/libs.versions.toml 保持一致）
  FFMPEG_KIT_NEXT_VERSION: '9.0.0'
  # 构建 AAR 时用的 Nix profile
  FFMPEG_KIT_NEXT_NIX_PROFILE: 'android-r27d'
  # FFmpegX 打包的 ABI（与 gradle.properties 的 ffmpegx.abis 一致）
  FFMPEGX_ABIS: 'arm64-v8a,armeabi-v7a,x86_64'

jobs:
  # ===========================================================================
  #  ffmpeg-kit-next AAR
  #
  #  它不发布二进制制品，必须现场构建。单独抽成一个 job 是因为 test 与 build
  #  都依赖这个产物 —— 编译期要用到它的类型，没有 AAR 连编译都过不去。
  #  两级缓存：Maven 产物（命中即完全跳过）+ Nix store（加速未命中时的构建）。
  # ===========================================================================
  ffmpeg-kit-next:
    name: Build ffmpeg-kit-next AAR
    runs-on: ubuntu-latest
    steps:
      - name: Cache AAR
        id: aar-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/prebuilt
          key: ffmpegkitnext-${{ env.FFMPEG_KIT_NEXT_VERSION }}-${{ env.FFMPEGX_ABIS }}-${{ runner.os }}
          restore-keys: ffmpegkitnext-${{ env.FFMPEG_KIT_NEXT_VERSION }}-

      - name: Install Nix
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-store-${{ env.FFMPEG_KIT_NEXT_NIX_PROFILE }}-${{ runner.os }}

      - name: Clone ffmpeg-kit-next
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/arthenica/ffmpeg-kit-next.git \
            "${GITHUB_WORKSPACE}/src"

      - name: Build AAR
        if: steps.aar-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/src
        run: |
          # --enable-gpl 是必须的：不开就没有 libx264/libx265，
          # FFmpegX 的「兼容优先」（全软编码）策略会失效。
          ./nix-android.sh \
            -p "${{ env.FFMPEG_KIT_NEXT_NIX_PROFILE }}" \
            --api-level=24 \
            --disable-arch-arm-v7a-neon \
            --disable-arch-x86 \
            --enable-gpl \
            --enable-lib-x264 \
            --enable-lib-x265
          # 归拢到一个稳定路径，方便缓存与下游 job 引用
          mkdir -p "${GITHUB_WORKSPACE}/prebuilt"
          cp -r prebuilt/bundle-android-aar-24-maven/. "${GITHUB_WORKSPACE}/prebuilt/"

      - name: Verify AAR
        run: |
          AAR="$(find "${GITHUB_WORKSPACE}/prebuilt" -name '*.aar' | head -1)"
          if [ -z "${AAR}" ]; then
            echo "::error::没有产出 AAR"
            exit 1
          fi
          ls -lh "${AAR}"
          # 确认 GPL 库真的编进去了（缺了会让全软编码静默失效）
          unzip -l "${AAR}" | grep -E 'libavcodec|libx264|libx265' || true

      - name: Upload AAR repository
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-next-maven
          path: ${{ github.workspace }}/prebuilt
          if-no-files-found: error

  # ===========================================================================
  #  单元测试
  #
  #  命令生成（Commands）与硬件加速规划（HardwarePlanner）都是纯逻辑，
  #  但编译期仍然要解析 ffmpeg-kit-next 的类型，所以依赖上面的 AAR。
  # ===========================================================================
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: ffmpeg-kit-next
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-kit-next-maven
          path: ${{ github.workspace }}/kit-next-repo

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          if [ ! -d "${SDK_ROOT}/cmdline-tools/latest" ]; then
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "${SDK_ROOT}/cmdline-tools/latest"
          fi
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-test-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-test-${{ runner.os }}-

      - name: Run unit tests
        env:
          FFMPEGX_FFMPEG_KIT_NEXT_REPO: ${{ github.workspace }}/kit-next-repo
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

  # ===========================================================================
  #  构建 APK
  # ===========================================================================
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: [ffmpeg-kit-next, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-kit-next-maven
          path: ${{ github.workspace }}/kit-next-repo

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          if [ ! -d "${SDK_ROOT}/cmdline-tools/latest" ]; then
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "${SDK_ROOT}/cmdline-tools/latest"
          fi
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-build-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-build-${{ runner.os }}-

      - name: Restore release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，release 包将不签名"
            exit 0
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${GITHUB_WORKSPACE}/release.jks"
          echo "RELEASE_STORE_FILE=${GITHUB_WORKSPACE}/release.jks" >> "$GITHUB_ENV"

      - name: Build debug APKs
        env:
          FFMPEGX_FFMPEG_KIT_NEXT_REPO: ${{ github.workspace }}/kit-next-repo
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APKs
        env:
          FFMPEGX_FFMPEG_KIT_NEXT_REPO: ${{ github.workspace }}/kit-next-repo
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegx-apks
          path: artifacts/*.apk
          if-no-files-found: error

  # ===========================================================================
  #  发布（仅 v* tag）
  # ===========================================================================
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: ffmpegx-apks
          path: apks

      - name: Rename with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd apks
          for f in *.apk; do
            # app-arm64-v8a-release.apk -> FFmpegX-1.0.0-arm64-v8a.apk
            ABIVAR="$(echo "$f" | sed -E 's/^app-(.+)-(debug|release)\.apk$/\1/')"
            BUILDVAR="$(echo "$f" | sed -E 's/^app-.+-(debug|release)\.apk$/\1/')"
            if [ "$BUILDVAR" = "debug" ]; then
              mv "$f" "FFmpegX-${VERSION}-${ABIVAR}-debug.apk"
            else
              mv "$f" "FFmpegX-${VERSION}-${ABIVAR}.apk"
            fi
          done
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
