name: Build FFmpegX

# 触发：推到 main/master、打 v* tag、PR、或手动。
# 默认走 kit 后端（预编译 ffmpeg-kit AAR），不需要 NDK，CI 只装 JDK + Android SDK。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 发版时需要创建 Release

env:
  SDK_PLATFORM: "platforms;android-36"
  SDK_BUILD_TOOLS: "build-tools;36.0.0"

jobs:
  # ---------- 1. 单元测试（85 个用例：硬件规划 / 命令生成 / 进度解析 / 预设） ----------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 不再依赖 android-actions/setup-android（其 v3 在 Node24 runner 上会失败）。
      # ubuntu-latest 自带 Android SDK；有 cmdline-tools 就直接用，没有才下载。
      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "$SDKMGR" ]; then
            echo "cmdline-tools 不存在，下载安装…"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "$SDK_PLATFORM" "$SDK_BUILD_TOOLS"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  # ---------- 2. 构建 debug APK ----------
  build:
    name: Build Debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "$SDKMGR" ]; then
            echo "cmdline-tools 不存在，下载安装…"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "$SDK_PLATFORM" "$SDK_BUILD_TOOLS"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 从 GitHub Secrets 还原 keystore。没配置就跳过，后续退回发布 debug 包。
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            {
              echo "RELEASE_STORE_FILE=release.keystore"
              echo "RELEASE_STORE_PASSWORD=$STORE_PW"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PW"
            } >> "$GITHUB_ENV"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
            echo "已配置签名密钥，将构建签名 release 包"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
            echo "未配置签名密钥：release 包不签名，发布时改用 debug 包"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 同时构建 release（顺带验证 R8 / proguard；有密钥时即为签名包）
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # 有签名就发布 release 包，否则发布 debug 包
      - name: Select APKs to publish
        run: |
          mkdir -p publish
          if [ "${{ steps.signing.outputs.signed }}" = "yes" ]; then
            cp app/build/outputs/apk/release/*.apk publish/ 2>/dev/null || true
          fi
          if [ -z "$(ls -A publish 2>/dev/null)" ]; then
            cp app/build/outputs/apk/debug/*.apk publish/
          fi
          echo "将发布的包："
          ls -l publish

      - name: Upload APK artifacts (one per ABI)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegx-apks
          path: publish/*.apk
          if-no-files-found: error

  # ---------- 3. 打 v* tag 时自动发 Release ----------
  release:
    name: Release on tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: ffmpegx-apks
          path: apk

      # 资产名带上版本号和 ABI，避免 Release 里出现一堆同名的 app-xxx-debug.apk
      - name: Rename APKs with version
        run: |
          mkdir -p out
          for f in apk/*.apk; do
            base=$(basename "$f")
            cp "$f" "out/ffmpegx-${GITHUB_REF_NAME}-${base#app-}"
          done
          ls -l out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
